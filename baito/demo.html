<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>リズムでバイト(新ルール試作)</title>
<style>
html,body{margin:0;height:100%;background:#f4efe6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Rounded Mplus 1c",system-ui,sans-serif;color:#2b2724}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#f4efe6}
.scr.on{display:flex}
h1{font-size:44px;margin:0;letter-spacing:.06em}
.sub{opacity:.7;font-size:14px}
.btn{font:inherit;font-size:18px;font-weight:700;padding:14px 30px;border-radius:999px;border:3px solid #2b2724;background:#fff;color:#2b2724;box-shadow:0 4px 0 #2b2724;cursor:pointer}
.btn.main{background:#f6c64a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2724}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:none;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700}
#hud .btn{pointer-events:auto;font-size:14px;padding:8px 16px}
.dbtn{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:11px 20px}.dbtn small{font-size:12px;opacity:.7}.dbtn.god{background:#2b2724;color:#f6c64a}
.rank{font-size:40px;font-weight:900}
.card{background:#fff;border:3px solid #2b2724;border-radius:16px;padding:12px 16px;width:min(320px,86vw);box-sizing:border-box;text-align:left;line-height:1.7}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title" class="scr on">
  <div class="sub">新ルール試作版:映画館・ボウリング・駐車場</div>
  <h1>リズムで<br>バイト</h1>
  <img src="img/k0.webp" alt="" id="tImg" style="height:150px">
  <div class="sub">きょうのバイト</div><div id="jobs" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(300px,80vw)"></div>
  <div id="diffs" style="display:flex;flex-direction:column;gap:10px;width:min(300px,80vw)"></div>
  <div class="sub">音を出して遊んでね(マナーモードは解除)</div>
</div>
<div id="hud"><span id="hudL"></span><button class="btn" id="skip">スキップ ▶</button></div>
<div id="result" class="scr" style="gap:10px;overflow-y:auto;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 24px)">
  <div class="sub" id="rBoss">料理長のひょうか</div>
  <div class="rank" id="rRank" style="font-size:34px"></div>
  <img id="rImg" alt="" style="height:110px">
  <div class="card" id="rCom"></div>
  <div style="display:flex;gap:10px"><button class="btn" id="again">もういちど</button><button class="btn main" id="toTitle">おわる</button></div>
</div>
<script>
'use strict';
// ---------- canvas ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const spring = a => a < 0 ? 0 : Math.exp(-8 * a) * Math.cos(26 * a);
const INK = '#2b2724';

// ---------- images ----------
const IMG = {};
['chef0', 'chef1', 'chef2', 'chef3', 'chef4', 'cuc', 'cucS', 'dai', 'daiS', 'car', 'carS', 'mel', 'melS', 'fish', 'fishS', 'duck', 'furn', 'k0', 'k1', 'k2', 'k3', 'k4', 'k5', 'k6', 'k7', 'board', 'm0','m1','m2','m3','m4','cuM','cuL','cuK','mgr','tk','tkS','pc','bc','dr','lobby','counter','p0','p1','p2','p3','p4','bw0','bw1','bw2','bmg','pinU','pinL','ball','shoe','puff','a0','a1','a2','a3','a4','gd0','gd1','drv0','drv1','car0','car1','car2','car3','bike','tow','bdeck','balley','plot','pgate']
  .forEach(k => { const i = new Image(); i.src = 'img/' + k + '.webp'; IMG[k] = i; });
function img(k, x, yb, h, o = {}) {

  ctx.save(); ctx.translate(x, yb); if (o.rot) ctx.rotate(o.rot);
  ctx.scale((o.sx || 1) * (o.flip ? -1 : 1), o.sy || 1); ctx.globalAlpha = o.a == null ? 1 : o.a;

}
function text(s, x, y, size, col, o = {}) {
  ctx.save(); ctx.globalAlpha = o.a == null ? 1 : clamp(o.a, 0, 1); ctx.font = `900 ${size}px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif`;

// ---------- audio ----------
let AC, master, NB;

  nya: t => { osc('sawtooth', 760, t, .26, .2, {to: 480, toT: .22, lp: 2000}); osc('sine', 380, t, .24, .08, {to: 260}); },
  pyui: t => { osc('square', 1300, t, .14, .1, {to: 1900, toT: .1, lp: 3000}); osc('sine', 2600, t + .02, .1, .08); },
  fake: (t, m) => osc('sawtooth', mtof(m), t, .06, .22, {lp: 1200}),
  chop: (t, m) => { osc('triangle', mtof(m), t, .09, .55); osc('sine', mtof(m) * 2.4, t, .04, .2); noise(t, .025, .35, 2500); },

// ---------- song & chart ----------
let BPM = 120, SPB = 60 / BPM, BAR = 4 * SPB, DIFF = 'normal';
const PROG = [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]];   // F Dm Bb C
const KIND = {
  cuc: {h: .62, lbl: 'ほいっ'}, car: {h: .58, lbl: 'ほいっ'}, dai: {h: .7, lbl: 'ほいっ'},
  mel: {h: .62, lbl: 'どーん', big: 1}, fish: {h: .6, lbl: 'ピチッ'},
duck: {h: .42, lbl: 'ピュイッ', trap: 1},
};
const NK = ['cuc', 'car', 'dai', 'fish'];
const P = str => str.trim().split(/\s+/).map((tok, i) => { const [x, c] = tok.split(':'); return {x: +x, r: c || 'n', i}; });
const ROUND = {
  // かんたん
  E1: P('0 2'), E2: P('0 1 2'), E3: P('0 1 2 3'), E4: P('0 2:d'), E5: P('0:m 2'), E6: P('0 1 3'), E7: P('0:d 1 2'), E8: P('0 1:d 2 3'),
  // ふつう
  R1: P('0 1 2'), R2: P('0 2'), R3: P('0 1:d 2'), R4: P('0 .5 1 2'), R5: P('0:m 2 3'), R6: P('0 1 1.5:d 2 3'), R7: P('0 .5 2 3:d'), R8: P('0 .5 1 1.5 2:m'), R9: P('0:d 1 2 3:d'), R10: P('0 1.5 2 3'), R11: P('.5 1 2 3'),
  // むずかしい
  H1: P('0 .5 1 2 2.5'), H2: P('0 .5 1.5 2 3'), H3: P('.5 1.5 2.5 3'), H4: P('0 1.5 2 2.5:d 3'), H5: P('0 1 1.5:d 2 2.5 3'), H6: P('0:m 2 2.5 3 3.5'), H7: P('0 .5 1 1.5 2 2.5:d 3'), H8: P('.5 1 1.5 2.5 3:m'), H9: P('0 1.5 3'), H10: P('0:d .5 1 1.5:d 2 3'),
  // 鬼
  O1: P('0 .25 .5 1 1.5 2'), O2: P('0 .5 .75 1 2 2.25 2.5'), O3: P('.25 .75 1.25 1.75 2.5 3'), O4: P('0 .5:d 1 1.5:d 2 2.5:d 3'), O5: P('0 .5 1 1.5 2 2.5 3 3.5'), O6: P('0 .75 1.5 2.25 3'), O7: P('0 .25:d .5 1 1.25 1.5:d 2:m'), O8: P('.5 .75 1 2 2.75 3 3.25'), O9: P('0:d .25 .5 .75 1:d 2 2.5 3:m'),
};
const KIND_ = KIND;
const DIFFS = {
  easy: {name: 'かんたん', bpm: 100, list: ['E1', 'E2', 'E1', 'E4', 'E3', 'E5', 'E6', 'E7', 'E2', 'E8', 'E3'], steam: [8, 9], pract: ['E1', 'E2', 'E4', 'E2', 'E4', 'E1', 'E4']},
  normal: {name: 'ふつう', bpm: 120, list: ['R1', 'R2', 'R1', 'R3', 'R4', 'R10', 'R5', 'R11', 'R6', 'R7', 'R9', 'R4', 'R8'], steam: [8, 9, 10], pract: ['R1', 'R2', 'R3', 'R1', 'R3', 'R2', 'R3']},
  hard: {name: 'むずかしい', bpm: 128, list: ['R4', 'H1', 'H9', 'H2', 'H4', 'H3', 'H6', 'H5', 'H8', 'H10', 'H7', 'H3', 'H6'], steam: [7, 8, 9, 10], pract: ['H1', 'H2', 'H4', 'H1', 'H4', 'H3', 'H4']},
  oni: {name: '鬼', bpm: 136, list: ['H1', 'O6', 'O1', 'O4', 'O2', 'O3', 'O7', 'O5', 'O8', 'O9', 'O6', 'O4', 'O7'], steam: [6, 7, 8, 9, 10], pract: ['O1', 'O6', 'O4', 'O1', 'O4', 'O6', 'O4']},
  god: {name: '神', bpm: 152, list: ['O6', 'O1', 'O9', 'O3', 'O7', 'O5', 'O2', 'O4', 'O8', 'O9', 'O5', 'O7', 'O9'], steam: 'all', pract: ['O1', 'O9', 'O6', 'O9', 'O4', 'O9']},
};
let MAIN = DIFFS.normal.list, STEAM = DIFFS.normal.steam, PRACT = DIFFS.normal.pract;
const isSteam = r => STEAM === 'all' ? r > 0 : STEAM.includes(r);
const INTRO = 2;

// ---------- new mechanics (demo) ----------
const MR = {
  mogiri: ['M1', 'M2', 'M1', 'M3', 'M4', 'M5', 'M6', 'M3', 'M8', 'M7', 'M6'],
  mogiriP: ['M1', 'M1', 'M3', 'M2', 'M3', 'M1', 'M3'],
  bowling: ['B1', 'B2', 'B1', 'B3', 'B6', 'B4', 'B5', 'B7', 'B9', 'B8', 'B5'],
  bowlingP: ['B1', 'B2', 'B3', 'B1', 'B3', 'B6', 'B3'],
  parking: ['C1', 'C2', 'C1', 'C4', 'C3', 'C5', 'C6', 'C2', 'C7', 'C4', 'C5'],
  parkingP: ['C1', 'C2', 'C4', 'C1', 'C4', 'C2', 'C4'],
};
const MRD = {
  M1: P('0 2'), M2: P('0 1 2'), M3: P('0 2:d'), M4: P('0 1 3'), M5: P('0:d 1 2'), M6: P('0 1 2 3'), M7: P('1 2:d 3'), M8: P('0 1:d 2 3'),
  B1: [[0, 1], [2, 2]], B2: [[0, 3]], B3: [[0, 2], [2, 'd']], B4: [[0, 1], [1, 1], [2, 3]], B5: [[0, 4]], B6: [[0, 2], [2, 2]], B7: [[0, 'd'], [1, 3]], B8: [[0, 3], [2, 'd'], [3, 1]], B9: [[0, 2], [1.5, 3]],
  C1: [[0, 2, 'R']], C2: [[0, 1, 'L'], [2, 1, 'R']], C3: [[0, 3, 'L']], C4: [[0, 1, 'R'], [2, 'd']], C5: [[0, 1.5, 'L'], [2, 1, 'R']], C6: [[0, 'd'], [1, 2, 'R']], C7: [[0, 1, 'L'], [1.5, 1, 'R'], [3, .5, 'L']],

function buildMech(rd, ch, ev, notes, r) {

    for (let i = 0; i < it.n; i++) { const n = {t: rb + (x + i * .5) * SPB, item: it, trap, r, step: i, m: ch[i % 3] + 24}; it.notes.push(n); notes.push(n); }

function topMech(t, rd, L) {

    if (a.res && a.res !== 'miss') { const d = t - a.hitT; img('tkS', x, base, sz * .5, {sx: 1 + .1 * spring(d)}); if (d < .25) text('ビリッ', x, base - h - 8, 22, INK, {stroke: 5, a: 1 - d / .25}); if (b && b.res === 'miss') text('返して…', x, base - h - 8, 16, '#e0533d', {stroke: 4}); continue; }

    ctx.fillStyle = 'rgba(43,39,36,.15)'; rr(W * .25, 48, W * .5, 6, 3); ctx.fill();
    ctx.fillStyle = INK; rr(W * .25, 48, W * .5 * clamp(t / G.end, 0, 1), 6, 3); ctx.fill();
  }
  for (const n of G.notes) if (n.res === 'good' && t - n.hitT < .4) text('おしい', W / 2, H * .7, 18, '#a07850', {stroke: 5, a: 1 - (t - n.hitT) / .4});
  if (G.fin && t - G.fin < 1.6) text('キマった。', W / 2, H * .3, 40, INK, {stroke: 8, a: 1.6 - (t - G.fin)});
}
requestAnimationFrame(frame);
</script>
