<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>リズムでバイト</title>
<style>
html,body{margin:0;height:100%;background:#f4efe6;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Rounded Mplus 1c",system-ui,sans-serif;color:#2b2724}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:#f4efe6}
.scr.on{display:flex}
h1{font-size:44px;margin:0;letter-spacing:.06em}
.sub{opacity:.7;font-size:14px}
.btn{font:inherit;font-size:18px;font-weight:700;padding:14px 30px;border-radius:999px;border:3px solid #2b2724;background:#fff;color:#2b2724;box-shadow:0 4px 0 #2b2724;cursor:pointer}
.btn.main{background:#f6c64a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2724}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:none;justify-content:space-between;align-items:center;pointer-events:none;font-weight:700}
#hud .btn{pointer-events:auto;font-size:14px;padding:8px 16px}
.dbtn{display:flex;justify-content:space-between;align-items:center;font-size:17px;padding:11px 20px}.dbtn small{font-size:12px;opacity:.7}.dbtn.god{background:#2b2724;color:#f6c64a}
.list{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:0 0 20px;gap:12px}
.hdr{width:100%;box-sizing:border-box;background:#f6c64a;border-bottom:3px solid #2b2724;padding:calc(env(safe-area-inset-top) + 22px) 20px 18px;text-align:left}
.logo{font-size:34px;font-weight:900;letter-spacing:.04em;line-height:1}.logo b{background:#2b2724;color:#f6c64a;padding:0 8px;margin-left:4px;border-radius:8px}
.tag{margin-top:8px;font-size:13px;font-weight:700}
.sec{width:min(360px,92vw);text-align:left;font-weight:900;font-size:15px;margin-top:6px}.sec span{font-size:12px;opacity:.6;font-weight:700}
#jobs{display:flex;flex-direction:column;gap:12px;width:min(360px,92vw)}
.jc{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid #2b2724;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 #2b2724;cursor:pointer;font:inherit;color:inherit}
.jc:active{transform:translateY(3px);box-shadow:0 1px 0 #2b2724}
.jc img{width:64px;height:64px;object-fit:contain;background:#f4efe6;border-radius:12px;flex:none}
.jc .nm{font-size:17px;font-weight:900}.jc .wg{font-size:13px;font-weight:700;color:#e0533d}.jc .ch{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;border:2px solid #2b2724;border-radius:999px;padding:1px 8px;background:#f4efe6}.chip.new{background:#e0533d;color:#fff;border-color:#e0533d}
.back{align-self:flex-start;margin:calc(env(safe-area-inset-top) + 14px) 0 0 14px;font:inherit;font-weight:900;font-size:15px;background:none;border:none;color:#2b2724;cursor:pointer}
.dcard{width:min(360px,92vw);background:#fff;border:3px solid #2b2724;border-radius:22px;padding:16px;box-sizing:border-box;text-align:left;box-shadow:0 5px 0 #2b2724}
.dcard img{display:block;margin:0 auto;height:140px;max-width:100%;object-fit:contain}
.dname{font-size:26px;font-weight:900;text-align:center;margin-top:6px}.dmeta{text-align:center;font-size:13px;font-weight:700;opacity:.75;margin:4px 0 10px}
.dsec{font-size:12px;font-weight:900;opacity:.6;margin:12px 0 4px}.dtxt{font-size:14px;line-height:1.6}
#diffs{display:flex;flex-direction:column;gap:9px}
.rank{font-size:40px;font-weight:900}
.card{background:#fff;border:3px solid #2b2724;border-radius:16px;padding:12px 16px;width:min(320px,86vw);box-sizing:border-box;text-align:left;line-height:1.7}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="title" class="scr on list">
  <div class="hdr"><div class="logo">リズムで<b>バイト</b></div><div class="tag">スキマ時間で、なぜか全部さばく。</div></div>
  <div class="sec">本日のスポット求人 <span id="jCount"></span></div>
  <div id="jobs"></div>
  <div class="sub" style="margin:8px 0 30px">🔈 音を出して遊んでね(マナーモードは解除)</div>
</div>
<div id="detail" class="scr list">
  <button class="back" id="back">‹ 求人一覧</button>
  <div class="dcard">
    <img id="tImg" alt="">
    <div class="dname" id="dName"></div>
    <div class="dmeta" id="dMeta"></div>
    <div class="dsec">仕事内容</div><div class="dtxt" id="dDesc"></div>
    <div class="dsec">シフトを選ぶ</div>
    <div id="diffs"></div>
  </div>
</div>
<div id="hud"><span id="hudL"></span><button class="btn" id="skip">スキップ ▶</button></div>
<div id="result" class="scr" style="gap:10px;overflow-y:auto;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 24px)">
  <div class="sub" id="rBoss">料理長のひょうか</div>
  <div class="rank" id="rRank" style="font-size:34px"></div>
  <img id="rImg" alt="" style="height:110px">
  <div class="card" id="rCom"></div>
  <div style="display:flex;gap:10px"><button class="btn" id="again">もういちど</button><button class="btn main" id="toTitle">おわる</button></div>
</div>
<script>
'use strict';
// ---------- canvas ----------
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W, H;
function resize() { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const spring = a => a < 0 ? 0 : Math.exp(-8 * a) * Math.cos(26 * a);
const INK = '#2b2724';

// ---------- images ----------
const IMG = {};
['chef0', 'chef1', 'chef2', 'chef3', 'chef4', 'cuc', 'cucS', 'dai', 'daiS', 'car', 'carS', 'mel', 'melS', 'fish', 'fishS', 'duck', 'furn', 'k0', 'k1', 'k2', 'k3', 'k4', 'k5', 'k6', 'k7', 'board', 'm0','m1','m2','m3','m4','cuM','cuL','cuK','mgr','tk','tkS','pc','bc','dr','lobby','counter','p0','p1','p2','p3','p4','bw0','bw1','bw2','bmg','pinU','pinL','ball','shoe','puff','a0','a1','a2','a3','a4','gd0','gd1','drv0','drv1','car0','car1','car2','car3','bike','tow','bdeck','balley','plot','pgate','s0','s1','s2','s3','s4','tab','cs0','cs1','cs2','it0','it1','it2','nm','ns','nt','ne','no','pl','bill','h0','h1','h2','h3','hs0','hb','hp','htv','hch','hfr','hbg','oboss','obg1','obg2','og0','og1','og2','ocl','o0','o1','o2','o3']
  .forEach(k => { const i = new Image(); i.src = 'img/' + k + '.webp'; IMG[k] = i; });
function img(k, x, yb, h, o = {}) {
  const i = IMG[k]; if (!i || !i.naturalWidth) return;
  const w = h * i.naturalWidth / i.naturalHeight;
  ctx.save(); ctx.translate(x, yb); if (o.rot) ctx.rotate(o.rot);
  ctx.scale((o.sx || 1) * (o.flip ? -1 : 1), o.sy || 1); ctx.globalAlpha = o.a == null ? 1 : o.a;
  ctx.drawImage(i, -w * (o.ax == null ? .5 : o.ax), -h, w, h); ctx.restore();
}
function text(s, x, y, size, col, o = {}) {
  ctx.save(); ctx.globalAlpha = o.a == null ? 1 : clamp(o.a, 0, 1); ctx.font = `900 ${size}px "Hiragino Maru Gothic ProN","M PLUS Rounded 1c",system-ui,sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.stroke) { ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || '#fff'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- audio ----------
let AC, master, NB, BGM, KICK, OUT;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (AC) { AC.resume(); return; }
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor(); master = AC.createGain(); master.gain.value = .85; master.connect(comp); comp.connect(AC.destination); BGM = AC.createGain(); BGM.gain.value = .32; BGM.connect(master); KICK = AC.createGain(); KICK.gain.value = .55; KICK.connect(master);
  NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0);
}
function osc(type, f, t, dur, vol, o = {}) {
  const s = AC.createOscillator(), g = AC.createGain(); s.type = type; s.frequency.setValueAtTime(f, t);
  if (o.to) s.frequency.exponentialRampToValueAtTime(o.to, t + (o.toT || dur));
  let n = s; if (o.lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; s.connect(fl); n = fl; }
  n.connect(g); g.connect(OUT || master); const a = o.a || .004;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.start(t); s.stop(t + dur + .05);
}
function noise(t, dur, vol, f, type = 'highpass', q = 1) {
  const s = AC.createBufferSource(); s.buffer = NB; const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = AC.createGain(); s.connect(fl); fl.connect(g); g.connect(OUT || master);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.start(t, Math.random() * .5); s.stop(t + dur + .02);
}
const SND = {
  kick: t => osc('sine', 150, t, .2, .9, {to: 42, toT: .12}),
  snare: t => { noise(t, .13, .45, 1600); osc('triangle', 190, t, .08, .25); },
  hat: (t, v = .12) => noise(t, .035, v, 7500),
  bass: (t, m, d) => { osc('sawtooth', mtof(m), t, d, .3, {lp: 520}); osc('sine', mtof(m), t, d, .35); },
  stab: (t, ms) => ms.forEach(m => osc('triangle', mtof(m), t, .14, .07, {lp: 2400})),
  lead: (t, m, d) => { osc('square', mtof(m), t, d, .06, {lp: 1800, a: .01}); osc('triangle', mtof(m + 12), t, d * .7, .04); },
  hoi: (t, m) => { osc('sawtooth', mtof(m), t, .13, .3, {to: mtof(m) * 1.32, toT: .08, lp: 1700}); osc('square', mtof(m - 12), t, .1, .08, {lp: 900}); noise(t, .03, .12, 3000); },
  dokkoi: (t, m, spb) => { osc('sawtooth', mtof(m - 5), t, .12, .3, {lp: 1300}); osc('sawtooth', mtof(m - 5), t + spb * .5, .22, .32, {to: mtof(m - 9), lp: 1300}); },
  pichi: (t, m) => { osc('sine', mtof(m + 12), t, .05, .35, {to: mtof(m + 5), toT: .04}); noise(t, .04, .2, 4000); },
  nya: t => { osc('sawtooth', 760, t, .26, .2, {to: 480, toT: .22, lp: 2000}); osc('sine', 380, t, .24, .08, {to: 260}); },
  pyui: t => { osc('square', 1300, t, .14, .1, {to: 1900, toT: .1, lp: 3000}); osc('sine', 2600, t + .02, .1, .08); },
  fake: (t, m) => osc('sawtooth', mtof(m), t, .06, .22, {lp: 1200}),
  chop: (t, m) => { osc('triangle', mtof(m), t, .09, .55); osc('sine', mtof(m) * 2.4, t, .04, .2); noise(t, .025, .35, 2500); },
  chopBig: (t, m) => { SND.chop(t, m); osc('sine', 95, t, .3, .8, {to: 48}); noise(t, .22, .45, 900, 'lowpass'); },
  swish: t => noise(t, .07, .12, 2500, 'bandpass', 2),
  stuck: t => { osc('square', 1700, t, .06, .1, {lp: 4000}); noise(t, .05, .3, 3000); osc('triangle', 300, t, .08, .3); },
  peta: t => { noise(t, .1, .4, 600, 'lowpass'); osc('sine', 180, t, .1, .3, {to: 90}); },
  ok: t => [0, 4, 7, 12].forEach((d, i) => osc('triangle', mtof(72 + d), t + i * .06, .25, .12)),
};

// ---------- song & chart ----------
let BPM = 120, SPB = 60 / BPM, BAR = 4 * SPB, DIFF = 'normal';
const PROG = [[53, 57, 60], [50, 53, 57], [46, 50, 53], [48, 52, 55]];   // F Dm Bb C
const KIND = {
  cuc: {h: .62, lbl: 'ほいっ'}, car: {h: .58, lbl: 'ほいっ'}, dai: {h: .7, lbl: 'ほいっ'},
  mel: {h: .62, lbl: 'どーん', big: 1}, fish: {h: .6, lbl: 'ピチッ'},
duck: {h: .42, lbl: 'ピュイッ', trap: 1},
};
const NK = ['cuc', 'car', 'dai', 'fish'];
const P = str => str.trim().split(/\s+/).map((tok, i) => { const [x, c] = tok.split(':'); return {x: +x, r: c || 'n', i}; });
const ROUND = {
  // かんたん
  E1: P('0 2'), E2: P('0 1 2'), E3: P('0 1 2 3'), E4: P('0 2:d'), E5: P('0:m 2'), E6: P('0 1 3'), E7: P('0:d 1 2'), E8: P('0 1:d 2 3'),
  // ふつう
  R1: P('0 1 2'), R2: P('0 2'), R3: P('0 1:d 2'), R4: P('0 .5 1 2'), R5: P('0:m 2 3'), R6: P('0 1 1.5:d 2 3'), R7: P('0 .5 2 3:d'), R8: P('0 .5 1 1.5 2:m'), R9: P('0:d 1 2 3:d'), R10: P('0 1.5 2 3'), R11: P('.5 1 2 3'),
  // むずかしい
  H1: P('0 .5 1 2 2.5'), H2: P('0 .5 1.5 2 3'), H3: P('.5 1.5 2.5 3'), H4: P('0 1.5 2 2.5:d 3'), H5: P('0 1 1.5:d 2 2.5 3'), H6: P('0:m 2 2.5 3 3.5'), H7: P('0 .5 1 1.5 2 2.5:d 3'), H8: P('.5 1 1.5 2.5 3:m'), H9: P('0 1.5 3'), H10: P('0:d .5 1 1.5:d 2 3'),
  // 鬼
  O1: P('0 .25 .5 1 1.5 2'), O2: P('0 .5 .75 1 2 2.25 2.5'), O3: P('.25 .75 1.25 1.75 2.5 3'), O4: P('0 .5:d 1 1.5:d 2 2.5:d 3'), O5: P('0 .5 1 1.5 2 2.5 3 3.5'), O6: P('0 .75 1.5 2.25 3'), O7: P('0 .25:d .5 1 1.25 1.5:d 2:m'), O8: P('.5 .75 1 2 2.75 3 3.25'), O9: P('0:d .25 .5 .75 1:d 2 2.5 3:m'),
};
const KIND_ = KIND;
const DIFFS = {
  easy: {name: 'かんたん', bpm: 100, list: ['E1', 'E2', 'E1', 'E4', 'E3', 'E5', 'E6', 'E7', 'E2', 'E8', 'E3'], steam: [8, 9], pract: ['E1', 'E2', 'E4', 'E2', 'E4', 'E1', 'E4']},
  normal: {name: 'ふつう', bpm: 120, list: ['R1', 'R2', 'R1', 'R3', 'R4', 'R10', 'R5', 'R11', 'R6', 'R7', 'R9', 'R4', 'R8'], steam: [8, 9, 10], pract: ['R1', 'R2', 'R3', 'R1', 'R3', 'R2', 'R3']},
  hard: {name: 'むずかしい', bpm: 128, list: ['R4', 'H1', 'H9', 'H2', 'H4', 'H3', 'H6', 'H5', 'H8', 'H10', 'H7', 'H3', 'H6'], steam: [7, 8, 9, 10], pract: ['H1', 'H2', 'H4', 'H1', 'H4', 'H3', 'H4']},
  oni: {name: '鬼', bpm: 136, list: ['H1', 'O6', 'O1', 'O4', 'O2', 'O3', 'O7', 'O5', 'O8', 'O9', 'O6', 'O4', 'O7'], steam: [6, 7, 8, 9, 10], pract: ['O1', 'O6', 'O4', 'O1', 'O4', 'O6', 'O4']},
  god: {name: '神', bpm: 152, list: ['O6', 'O1', 'O9', 'O3', 'O7', 'O5', 'O2', 'O4', 'O8', 'O9', 'O5', 'O7', 'O9'], steam: 'all', pract: ['O1', 'O9', 'O6', 'O9', 'O4', 'O9']},
};
let MAIN = DIFFS.normal.list, STEAM = DIFFS.normal.steam, PRACT = DIFFS.normal.pract;
const isSteam = r => STEAM === 'all' ? r > 0 : STEAM.includes(r);
const INTRO = 2;

// ---------- new mechanics (demo) ----------
const MR = {
  mogiri: ['F1', 'F2', 'F1', 'F3', 'F4', 'F5', 'F6', 'F7', 'F5', 'F8'],
  mogiriP: ['F1', 'F1', 'F3', 'F1', 'F3', 'F3'],
  bowling: ['Q1', 'Q2', 'Q1', 'Q3', 'Q4', 'Q5', 'Q6', 'Q7', 'Q5', 'Q8'],
  bowlingP: ['Q1', 'Q1', 'Q3', 'Q1', 'Q3', 'Q3'],
  parking: ['C1', 'C2', 'C1', 'C4', 'C3', 'C5', 'C6', 'C2', 'C7', 'C4', 'C5'],
  parkingP: ['C1', 'C2', 'C4', 'C1', 'C4', 'C2', 'C4'],
};
const MRD = {
  M1: P('0 2'), M2: P('0 1 2'), M3: P('0 2:d'), M4: P('0 1 3'), M5: P('0:d 1 2'), M6: P('0 1 2 3'), M7: P('1 2:d 3'), M8: P('0 1:d 2 3'),
  F1: '1 2 3 4 5 6 7', F2: '1 2 3 5 6 7', F3: '1 2 3:d 4 5 6 7:d', F4: '1 2 2.5 3 4 5 6 6.5 7', F5: '1 2:d 3 4 5:d 6 7', F6: '1 1.5 2 3 4 4.5 5 6 7', F7: '1 2 3 4:d 5 6:d 7', F8: '1 2 3 4 5 6 7 7.5',
  Q1: '0 2 4 6', Q2: '0 2 3 4 6', Q3: '0 2:d 4 6', Q4: '0 1 2 4 5 6', Q5: '0 2 4:d 5 6', Q6: '0 1.5 2 4 5.5 6', Q7: '0 1 2:d 3 4 6:d', Q8: '0 .5 2 2.5 4 5 6',
  B1: [[0, 1], [2, 2]], B2: [[0, 3]], B3: [[0, 2], [2, 'd']], B4: [[0, 1], [1, 1], [2, 3]], B5: [[0, 4]], B6: [[0, 2], [2, 2]], B7: [[0, 'd'], [1, 3]], B8: [[0, 3], [2, 'd'], [3, 1]], B9: [[0, 2], [1.5, 3]],
  C1: [[0, 2, 'C']], C2: [[0, 1, 'C'], [2, 1, 'C']], C3: [[0, 3, 'C']], C4: [[0, 1, 'C'], [2, 'd']], C5: [[0, 1.5, 'C'], [2, 1, 'C']], C6: [[0, 'd'], [1, 2, 'C']], C7: [[0, 1, 'C'], [1.5, 1, 'C'], [3, .5, 'C']],
};
function buildMech(rd, ch, ev, notes, r) {
  const cb = rd.cb, rb = rd.rb, spec = MRD[rd.name];
  if (J.mech === 'flow' || J.mech === 'quick') spec.split(' ').forEach((tok, j) => {
    const [xs, c] = tok.split(':'), x = +xs, trap = c === 'd', nt = cb + (x + (J.mech === 'quick' ? 1 : 0)) * SPB, cT = nt - SPB;
    const k = J.mech === 'flow' ? (trap ? J.traps[(r + j) % 3] : 'tk') : (trap ? 'shoe' : 'pin'), voice = ch[2] + 12, it = {k, x, j, cueT: cT, round: rd, notes: []};
    ev.push({t: cT, f: J.mech === 'flow' ? (trap ? SND.buzz : t => SND.voice(t, voice)) : (trap ? SND.thud : t => SND.pins(t, 2))});
    const n = {t: nt, item: it, trap, r, step: 0, m: ch[j % 3] + 24}; it.notes.push(n); it.note = n; notes.push(n); rd.items.push(it);
  });
  if (J.mech === 'drop') spec.split(' ').forEach((tok, j) => {
    const [xs, c] = tok.split(':'), x = +xs, trap = c === 'd', cT = cb + x * SPB, nt = cT + 2 * SPB;
    const k = trap ? 'fr' : J.normal[(r + j) % 4], it = {k, x, j, cueT: cT, round: rd, notes: []};
    ev.push({t: cT, f: trap ? SND.rumble : t => SND.voice(t, ch[2] + 12, 1.5)});
    const n = {t: nt, item: it, trap, r, m: ch[j % 3] + 24}; it.notes.push(n); it.note = n; notes.push(n); rd.items.push(it);
  });
  if (J.mech === 'two') spec.forEach((o, j) => {
    const k = o.r === 'd' ? J.traps[(r + j) % J.traps.length] : 'tk', K = J.kind[k], voice = ch[2] + 12, it = {k, x: o.x, j, cueT: cb + o.x * SPB, round: rd, notes: []};
