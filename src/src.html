<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4ecda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>はちまきビート</title>
<style>
:root{--ink:#3b2f2a;--paper:#f4ecda;--red:#e8554e;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;
 font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.paper{background:radial-gradient(circle at 20% 10%,#fbf6ea,transparent 60%),radial-gradient(circle at 80% 90%,#efe3c8,transparent 60%),var(--paper)}
.btn{border:3px solid var(--ink);background:var(--red);color:#fff;font-weight:800;font-size:20px;border-radius:999px;padding:14px 34px;box-shadow:0 4px 0 var(--ink);cursor:pointer;letter-spacing:.05em}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sub{background:#fff;color:var(--ink)}
.btn.sm{font-size:16px;padding:10px 18px;white-space:nowrap}
/* title */
#title{align-items:center;justify-content:center;gap:18px;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 20px);text-align:center}
#title h1{margin:0;font-size:clamp(40px,12vw,64px);line-height:1;letter-spacing:.04em;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
#title p{margin:0;font-size:15px;opacity:.8}
.parade{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;max-width:480px}
.parade img{height:clamp(60px,17vw,90px);animation:bob 1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* select */
#select header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 12px) 16px 8px}
#select h2{margin:0;font-size:22px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:20px;display:grid;place-items:center;box-shadow:0 3px 0 var(--ink)}
.grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 14px calc(var(--sab) + 20px);align-content:start}
.card{position:relative;background:#fffaf0;border:3px solid var(--ink);border-radius:18px;padding:8px 8px 10px;text-align:center;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card img{height:110px;max-width:100%;object-fit:contain;display:block;margin:0 auto 4px}
.card .nm{font-weight:800;font-size:16px}
.card .md{font-size:12px;opacity:.8;margin-top:2px}
.card .st{color:var(--red);font-size:12px;letter-spacing:1px;margin-top:2px}
.badge{position:absolute;top:6px;right:8px;font-weight:900;font-size:18px;color:var(--red);-webkit-text-stroke:1px var(--ink)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(59,47,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--paper);border:3px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 20px calc(var(--sab) + 20px);text-align:center;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
.sheet img{height:150px}
.sheet h3{margin:4px 0 0;font-size:24px}
.sheet .mt{display:inline-block;margin:6px 0;background:var(--ink);color:#fff;border-radius:999px;padding:3px 14px;font-size:14px}
.sheet .ds{font-size:15px;line-height:1.7;margin:8px 0 12px}
.sheet .row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.meta{font-size:13px;opacity:.75}
input[type=range]{width:100%;accent-color:var(--red)}
/* play */
#play{background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#pauseBtn{position:absolute;left:12px;top:calc(var(--sat) + 10px);z-index:5;width:40px;height:40px;font-size:16px}
/* result */
#result{align-items:center;justify-content:center;gap:6px;padding:calc(var(--sat) + 16px) 20px calc(var(--sab) + 16px);text-align:center}
#result img{height:min(28vh,200px)}
.rank{font-size:84px;font-weight:900;line-height:1;color:var(--red);-webkit-text-stroke:3px var(--ink);text-shadow:0 5px 0 var(--ink)}
.score{font-size:34px;font-weight:900;letter-spacing:.03em}
.quote{font-size:16px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;margin:4px 0}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:2px 14px;font-size:14px;margin:6px 0}
.stats b{font-size:18px;display:block}
.fc{color:#d68a00;font-weight:900}
#select header{gap:10px}.grid .sec{grid-column:1/-1;font-weight:900;font-size:15px;margin:6px 2px -2px}#select h2{flex:1}
#band{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;padding:4px 16px 8px;min-height:84px}
#band img{height:72px}#band .lbl{font-size:12px;opacity:.7;align-self:center;white-space:nowrap}
.slist{flex:1;overflow-y:auto;padding:4px 14px calc(var(--sab) + 20px);display:flex;flex-direction:column;gap:10px}
.stg{display:flex;align-items:center;gap:12px;background:#fffaf0;border:3px solid var(--ink);border-radius:18px;padding:8px 12px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
.stg:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.stg img{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);object-fit:cover}
.stg .no{font-weight:900;font-size:13px;color:var(--red)}.stg .t1{font-weight:800;font-size:16px}.stg .t2{font-size:12px;opacity:.75}
.stg.lock{opacity:.45;filter:grayscale(1)}.stg.rx{background:#fff1d6}
.stg .md{margin-left:auto;font-size:13px;font-weight:900;color:#d68a00;white-space:nowrap}
.tbox{position:relative;width:100%;max-width:520px;margin:0 10px calc(var(--sab) + 14px);background:#fffaf0;border:3px solid var(--ink);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;min-height:120px;box-shadow:0 4px 0 var(--ink)}
.tbox img{width:84px;height:84px;border-radius:50%;border:3px solid var(--ink);flex:none;object-fit:cover}
.tname{font-weight:900;color:var(--red);font-size:15px}.ttext{font-size:17px;line-height:1.6;margin-top:2px}
.tnext{position:absolute;right:14px;bottom:8px;font-size:12px;animation:bob 1s infinite}
.verdict{font-size:48px;font-weight:900;line-height:1.1;color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
#rJoin img{height:min(22vh,170px)}#rJoin .jt{font-weight:900;font-size:18px}
</style>
</head>
<body>
<div id="title" class="screen paper on">
  <h1>はちまき<br>ビート</h1>
  <p>10匹の相棒と、10通りのリズム</p>
  <div class="parade" id="parade"></div>
  <button class="btn" id="startBtn">ストーリー</button>
  <button class="btn sub sm" id="freeBtn">フリープレイ</button>
  <p class="meta">音が出ます。マナーモードを解除してね</p>
</div>

<div id="select" class="screen paper">
  <header><button class="iconbtn" id="selBack" aria-label="もどる">←</button><h2>フリープレイ</h2><button class="iconbtn" id="setBtn" aria-label="せってい">⚙</button></header>
  <div class="grid" id="grid"></div>
</div>

<div id="story" class="screen paper">
  <header style="display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) 16px 6px"><button class="iconbtn" id="stBack" aria-label="もどる">←</button><h2 style="margin:0;font-size:22px">はちまきバンド結成記</h2></header>
  <div id="band"></div>
  <div class="slist" id="slist"></div>
</div>

<div class="modal" id="talk"><div class="tbox" id="tbox">
  <img id="tFace" alt=""><div><div class="tname" id="tName"></div><div class="ttext" id="tText"></div></div><div class="tnext">▼</div>
</div></div>

<div id="play" class="screen">
  <canvas id="cv"></canvas>
  <button class="iconbtn" id="pauseBtn" aria-label="一時停止">❚❚</button>
  <button class="btn sm" id="skipBtn" style="position:absolute;right:12px;top:calc(var(--sat) + 10px);z-index:5;display:none">スキップ ▶</button>
</div>

<div id="result" class="screen paper">
  <img id="rImg" alt="">
  <div class="quote" id="rQuote"></div>
  <div class="rank" id="rRank"></div>
  <div class="score" id="rScore"></div>
  <div id="rFc"></div>
  <div id="rJoin"></div>
  <div class="stats" id="rStats"></div>
  <div class="meta" id="rBest"></div>
  <div class="row" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center">
    <button class="btn sub sm" id="rBack">えらびなおす</button>
    <button class="btn sm" id="rRetry">もういちど</button>
    <button class="btn sm" id="rNext" style="display:none;background:#3aa35b">つぎへ ▶</button>
  </div>
</div>

<div class="modal" id="detail"><div class="sheet">
  <img id="dImg" alt="">
  <h3 id="dName"></h3>
  <div class="mt" id="dMode"></div>
  <div class="ds" id="dDesc"></div>
  <div class="meta" id="dMeta"></div>
  <div class="row"><button class="btn sub sm" id="dBack">もどる</button><button class="btn" id="dGo">あそぶ！</button></div>
</div></div>

<div class="modal" id="pause"><div class="sheet">
  <h3>ひとやすみ</h3>
  <div class="row"><button class="btn sub sm" id="pQuit">やめる</button><button class="btn sub sm" id="pRetry">やりなおす</button><button class="btn sm" id="pGo">つづける</button></div>
</div></div>

<div class="modal" id="settings"><div class="sheet">
  <h3>せってい</h3>
  <div class="ds">タイミング調整:<b id="offV">0</b> ms<br><span class="meta">判定が「SLOW」ばかりなら＋、「FAST」ばかりなら−に</span></div>
  <input type="range" id="offR" min="-200" max="200" step="10" value="0">
  <div class="row"><button class="btn sm" id="sClose">とじる</button></div>
</div></div>

<script>
const SPRITES = __SPRITES__;
const FACES = __FACES__;
const POSES = __POSES__;
const ACTS = __ACTS__;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function RNG(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---------- characters ---------- */
const CHARS = [
 {id:'pug',name:'パグ太',mode:'lanes',title:'4レーン おとしもの',desc:'上から落ちてくる音符が線に重なったら、そのレーンをタップ！',bpm:128,scale:'major',root:62,wave:'square',density:2,lanes:4,gap:.5,appr:1.25,stars:3,bg:'#f7e2bd',say:['へへっ、いいリズムじゃん！','も、もう一回…！']},
 {id:'bulldog',name:'ブル親方',mode:'drum',title:'どすこいドラム',desc:'赤い〈ドン〉は画面の左半分、青い〈カッ〉は右半分。枠に重なった瞬間に叩け！',bpm:116,scale:'minor',root:57,wave:'sawtooth',density:2,gap:.5,appr:1.5,stars:3,bg:'#f3cdbf',say:['うむ、いい太鼓だ。','腰が入っとらん！']},
 {id:'pig',name:'ぶたまる',mode:'simon',title:'まねっこブーブー',desc:'ぶたまるが鳴らしたリズムを、次の小節でそっくりマネして画面をタップ！',bpm:100,scale:'major',root:60,wave:'square',density:1,gap:0,appr:1,stars:2,lenient:1.2,bg:'#fbd9dc',say:['ブッ！そっくりだブー','ブー…ちがうブー']},
 {id:'capybara',name:'カピ湯',mode:'lanes',title:'ゆったり2レーン',desc:'左右に落ちてくる音符を、のんびりタップ。はじめての人におすすめ。',bpm:92,scale:'major',root:60,wave:'triangle',density:0,lanes:2,gap:1,appr:1.8,stars:1,lenient:1.3,bg:'#d9e8d0',say:['…いいお湯だね。','…まぁ、ゆっくりいこう。']},
 {id:'sloth',name:'ナマケ先輩',mode:'lanes',title:'のびのびロング',desc:'長い音符は、離さずに最後まで押しっぱなし。あわてず、ゆっくり。',bpm:84,scale:'major',root:58,wave:'sine',density:0,lanes:3,holds:true,gap:1,appr:1.8,stars:2,lenient:1.2,bg:'#e4dccb',say:['のびのび〜、さいこ〜','あせらな〜い、あせらな〜い']},
 {id:'puffer',name:'プクオ',mode:'circle',title:'ぷくぷくサークル',desc:'外側の輪が縮んでフグに重なったら、そのフグをタップ！',bpm:120,scale:'minor',root:62,wave:'triangle',density:1,gap:.75,appr:1,stars:3,bg:'#cfe6f0',say:['ぷく〜っ！まんぷく！','しぼんじゃった…']},
 {id:'frog',name:'ケロ吉',mode:'jump',title:'ケロケロジャンプ',desc:'流れてくる石が足もとに来た瞬間、画面のどこでもタップしてジャンプ！',bpm:112,scale:'major',root:64,wave:'square',density:1,gap:.75,appr:1.6,stars:2,bg:'#dff0c8',say:['ケロッ、ひとっとびだ！','ゲコ…足がもつれた']},
 {id:'penguin',name:'ペン次郎',mode:'swipe',title:'つるつるスワイプ',desc:'矢印が輪に重なったら、その向きにシュッとスワイプ！',bpm:108,scale:'minor',root:60,wave:'triangle',density:1,gap:1,appr:1.4,stars:3,lenient:1.15,bg:'#dcecf7',say:['つるっと完ぺき！','すべって転んだ…']},
 {id:'mole',name:'モグ',mode:'whack',title:'もぐらたたき',desc:'穴から顔を出しきった瞬間にタップ！早すぎても遅すぎてもダメ。',bpm:110,scale:'major',root:59,wave:'square',density:1,gap:.75,appr:.75,stars:2,bg:'#e9dcc0',say:['モグッ！見つかっちゃった','モグ…まだまだ隠れるよ']},
 {id:'dog',name:'シワ丸',mode:'lanes',title:'激ムズ4レーン',desc:'同時押しとロングノーツが入り混じる上級コース。覚悟して挑め。',bpm:150,scale:'minor',root:61,wave:'sawtooth',density:3,lanes:4,holds:true,chords:true,gap:.25,appr:1,stars:5,bg:'#ecd2c4',say:['シワまで震えたぜ…！','上級者の壁、高いだろ？']},
];
const IM = {};
for (const c of CHARS) { const im = new Image(); im.src = SPRITES[c.id]; IM[c.id] = im; }

/* ---------- music generation ---------- */
const SCALES = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10]};
const PROGS = {major:[[0,4,5,3],[0,5,3,4],[3,4,2,5],[0,3,4,4],[5,3,0,4]], minor:[[0,5,2,6],[0,3,4,0],[0,6,5,4],[5,6,0,0],[0,3,6,4]]};
const RHY = [
 [[[0,2],[2,2]],[[0,1],[1,1],[2,2]],[[0,3],[3,1]],[[0,1],[2,1],[3,1]],[[0,2],[2,1],[3,1]],[[0,1.5],[2,2]]],
 [[[0,1],[1,.5],[1.5,.5],[2,1],[3,1]],[[0,.5],[.5,.5],[1,1],[2,.5],[2.5,1.5]],[[0,1.5],[1.5,.5],[2,1],[3,1]],[[0,1],[1,1],[2,.5],[2.5,.5],[3,1]],[[0,.5],[1,.5],[1.5,1],[2.5,.5],[3,1]]],
 [[[0,.5],[.5,.5],[1,.5],[1.5,.5],[2,1],[3,.5],[3.5,.5]],[[0,.75],[.75,.75],[1.5,.5],[2,.5],[2.5,.5],[3,1]],[[0,.5],[.5,.5],[1,1],[2,.5],[2.5,.5],[3,.5],[3.5,.5]],[[0,1],[1,.5],[1.5,.5],[2,.5],[2.5,.5],[3,1]]],
 [[[0,.25],[.25,.25],[.5,.5],[1,.5],[1.5,.5],[2,.25],[2.25,.25],[2.5,.5],[3,.5],[3.5,.5]],[[0,.5],[.5,.25],[.75,.25],[1,.5],[1.5,.5],[2,.5],[2.5,.5],[3,.25],[3.25,.25],[3.5,.5]],[[0,1],[1,.5],[1.5,.25],[1.75,.25],[2,1],[3,.5],[3.5,.5]]]
];
const DRUMS = [[[0,2],[1,3]],[[0,1.5,2],[1,3]],[[0,.5,2,2.5],[1,3]],[[0,2,2.5],[1,3,3.5]],[[0,.75,2,2.75],[1,3]]];
const degMidi = (root, sc, d) => { const n = sc.length, o = Math.floor(d / n); return root + o * 12 + sc[((d % n) + n) % n]; };
const pick = (rng, a) => a[Math.floor(rng() * a.length)];

function genBar(rng, c, sc, chord, st, cadence) {
  const pool = RHY[c.density].concat(c.density > 0 ? RHY[c.density - 1] : []);
  const tpl = cadence ? [[0, 1], [1, 1], [2, 2]] : pick(rng, pool);
  const out = [];
  tpl.forEach(([p, l], i) => {
    let d = st.deg + pick(rng, [-2, -1, -1, 0, 1, 1, 2]);
    if (p % 1 === 0 && (p === 0 || p === 2 || rng() < .5)) {
      const tones = [-7, -5, -3, 0, 2, 4, 7, 9, 11, 14].map(x => x + chord);
      d = tones.reduce((a, b) => Math.abs(b - d) < Math.abs(a - d) ? b : a);
    }
    if (cadence && i === tpl.length - 1) d = st.deg > 3 ? 7 : 0;
    d = clamp(d, 0, 11); st.deg = d;
    out.push({p, l, midi: degMidi(c.root, sc, d)});
  });
  return out;
}

function genSong(c) {
  const rng = RNG(hash(c.id) * 7 + 3), sc = SCALES[c.scale], P = PROGS[c.scale], spb = 60 / c.bpm;
  const pa = pick(rng, P); let pb; do { pb = pick(rng, P); } while (pb === pa);
  const plan = [['intro', 2, pa]]; let left = c.mainBars || 24, kk = 0;
  while (left > 0) { const n = Math.min(8, left); plan.push([kk % 2 ? 'B' : 'A', n, kk % 2 ? pb : pa]); left -= n; kk++; }
  plan.push(['outro', 2, pa]);
  const bars = [];
  plan.forEach(([s, n, pr]) => { for (let i = 0; i < n; i++) bars.push({sec: s, i, chord: pr[i % 4]}); });
  const ev = [], st = {deg: 4}, memo = {}, barType = {};
  const add = (b, type, o = {}) => ev.push(Object.assign({b, t: b * spb, type}, o));
  let drPat = DRUMS[0];
  const drPool = c.density === 0 ? DRUMS.slice(0, 1) : c.density === 1 ? DRUMS.slice(0, 3) : DRUMS;
  bars.forEach((bar, bi) => {
    const b0 = bi * 4, main = bar.sec === 'A' || bar.sec === 'B';
    // drums
    if (bar.sec === 'intro') {
      add(b0, 'kick', {chart: false});
      if (bar.i === 1) [0, 1, 2, 3].forEach(x => add(b0 + x, 'snare', {v: .6}));
      else add(b0 + 2, 'kick');
    } else if (bar.sec === 'outro') {
      add(b0, 'kick');
      if (bar.i === 1) { add(b0 + 2, 'kick'); add(b0 + 2, 'snare'); }
    } else {
      if (bar.i % 2 === 0) drPat = pick(rng, drPool);
      let [ks, ss] = c.cue ? [[0, 2, 2.5], [1, 3]] : drPat;
      if (bar.i === 7 && c.density > 0) { ks = c.cue ? [0, 1, 2] : [0, 2]; ss = [1, 2.5, 3, 3.25, 3.5, 3.75]; }
      ks.forEach(x => add(b0 + x, 'kick', {chart: true}));
      ss.forEach(x => add(b0 + x, 'snare', {chart: true}));
    }
    if (bar.sec !== 'outro' || bar.i === 0) {
      const step = c.density === 0 && !c.cue ? 1 : .5;
      for (let x = 0; x < 4; x += step) add(b0 + x, 'hat', {v: x % 1 ? 1 : .55, open: c.cue && x % 1 && bar.sec === 'B'});
    }
    // bass + chord
    const bassRoot = degMidi(c.root - 24, sc, bar.chord);

  if (!G || !$('#play').classList.contains('on')) return;
  const now = songNow();
  if (!G.paused && !G.over) { pump(); update(now); }
  const sh = (performance.now() - (G.shake || -1e9)) / 110;
  ctx.save(); if (sh < 1) ctx.translate((Math.random() - .5) * 7 * (1 - sh), (Math.random() - .5) * 7 * (1 - sh));
  MODES[G.c.mode].draw(now); ctx.restore();
  drawHUD(now);
}
requestAnimationFrame(frame);
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); if (!G || G.paused || G.over) return;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  MODES[G.c.mode].down(e.clientX, e.clientY, inputTime(e), e.pointerId);
}, {passive: false});
cv.addEventListener('pointermove', e => { if (G && !G.paused && MODES[G.c.mode].move) MODES[G.c.mode].move(e.clientX, e.clientY, e.pointerId); }, {passive: false});
const onUp = e => { if (G && MODES[G.c.mode].up) MODES[G.c.mode].up(e.pointerId, e); };
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
document.addEventListener('touchmove', e => { if ($('#play').classList.contains('on')) e.preventDefault(); }, {passive: false});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function pauseGame() { if (!G || G.paused || G.over || !$('#play').classList.contains('on')) return; G.paused = true; actx.suspend(); $('#pause').classList.add('on'); }
function resumeGame() { $('#pause').classList.remove('on'); if (!G) return; actx.resume().then(() => { G.paused = false; }); }
function quitGame() { if (G) { G.over = true; } voiceStop(); $('#pause').classList.remove('on'); hardStop(); if (playStage && !playStage.free) { renderStory(); show('story'); } else { show('select'); renderGrid(); } }
function hardStop() { if (actx) { actx.close(); actx = null; } initAudio(); }

function finish() {
  G.over = true; voiceStop();
  if (G.c.stage) return storyFinish();
  $('#rBack').textContent = 'えらびなおす'; $('#rJoin').innerHTML = ''; $('#rNext').style.display = 'none';
  const c = G.c, sc = G.score, rank = sc >= 950000 ? 'S' : sc >= 850000 ? 'A' : sc >= 700000 ? 'B' : sc >= 500000 ? 'C' : 'D';
  const fc = G.cnt.MISS === 0;
  const best = store.get('hb_best_' + c.id, null);
  const isNew = sc > 0 && (!best || sc > best.score);
  if (isNew) store.set('hb_best_' + c.id, {score: sc, rank, fc});
  $('#rImg').src = SPRITES[c.id];
  $('#rQuote').textContent = `${c.name}「${c.say[rank === 'S' || rank === 'A' || rank === 'B' ? 0 : 1]}」`;
  $('#rRank').textContent = rank;
  $('#rScore').textContent = sc.toLocaleString();
  $('#rFc').innerHTML = sc === 1000000 ? '<span class="fc">ALL PERFECT!!</span>' : fc ? '<span class="fc">FULL COMBO!</span>' : `MAX COMBO ${G.maxCombo}`;
  $('#rStats').innerHTML = ['PERFECT', 'GREAT', 'GOOD', 'MISS'].map(k => `<div style="color:${JCOL[k]}">${k}<b>${G.cnt[k]}</b></div>`).join('') +
    `<div style="grid-column:1/5;font-size:13px;opacity:.75">FAST ${G.fast} / SLOW ${G.slow}</div>`;
  $('#rBest').textContent = isNew ? 'じこベスト更新！' : (best ? `ベスト ${best.score.toLocaleString()}(${best.rank})` : '');
  setTimeout(() => show('result'), 300);
}

/* ---------- UI ---------- */
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
let current = null;
function renderGrid() {
  $('#grid').innerHTML = '<div class="sec">合図リズム(リズム天国風)</div>' + FREECUE.map((st, i) => {
    const m = store.get('hb_medal_' + st.id, null), g = st.games.length > 1 ? null : SCENES[st.games[0]];
    return `<div class="card" data-f="${i}" style="background:${st.bg}">${m ? `<div class="badge">${m === 'high' ? '★' : '○'}</div>` : ''}<img src="${FACES[(g ? g.char : 'pug') + '_smile']}" alt="" style="border-radius:50%;width:96px;height:96px;border:3px solid var(--ink)"><div class="nm">${st.name}</div><div class="md">${g ? CH(g.char).name : 'ぜんぶのゲーム'}</div></div>`;
  }).join('') + '<div class="sec">譜面リズム</div>' + CHARS.map((c, i) => {
    const b = store.get('hb_best_' + c.id, null);
    return `<div class="card" data-i="${i}" style="background:${c.bg}">${b ? `<div class="badge">${b.rank}</div>` : ''}<img src="${SPRITES[c.id]}" alt=""><div class="nm">${c.name}</div><div class="md">${c.title}</div><div class="st">${'★'.repeat(c.stars)}${'☆'.repeat(5 - c.stars)}</div></div>`;
  }).join('');
}
$('#grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  if (card.dataset.f != null) { const st = FREECUE[+card.dataset.f]; const g = st.games.length > 1 ? null : SCENES[st.games[0]]; const m = store.get('hb_medal_' + st.id, null);
    $('#dImg').src = g ? FACES[g.char + '_angry'] : ACTS.lineup; $('#dName').textContent = st.name; $('#dMode').textContent = g ? CH(g.char).name : 'リミックス'; $('#dDesc').textContent = g ? g.guide : 'すべての合図ゲームが次々に切り替わるよ'; $('#dMeta').textContent = `BPM ${st.bpm}` + (m ? ` ・ ${m === 'high' ? 'ハイレベル' : '合格'}` : '');
    current = null; freeStage = st; $('#detail').classList.add('on'); return; }
  freeStage = null;
  const c = CHARS[+card.dataset.i]; current = c;
  $('#dImg').src = SPRITES[c.id]; $('#dName').textContent = c.name; $('#dMode').textContent = c.title; $('#dDesc').textContent = c.desc;
  const b = store.get('hb_best_' + c.id, null);
  $('#dMeta').textContent = `BPM ${c.bpm} ・ むずかしさ ${'★'.repeat(c.stars)}` + (b ? ` ・ ベスト ${b.score.toLocaleString()}(${b.rank})` : '');
  $('#detail').classList.add('on');
});
$('#dBack').onclick = () => $('#detail').classList.remove('on');
let freeStage = null;
$('#dGo').onclick = () => { $('#detail').classList.remove('on'); if (freeStage) return startStage(freeStage); playStage = null; startGame(current); };
$('#startBtn').onclick = () => { initAudio(); renderStory(); show('story'); };
$('#freeBtn').onclick = () => { initAudio(); playStage = null; renderGrid(); show('select'); };
$('#selBack').onclick = () => show('title');
$('#stBack').onclick = () => show('title');
$('#pauseBtn').onclick = pauseGame;
$('#pGo').onclick = resumeGame;
$('#pQuit').onclick = quitGame;
$('#pRetry').onclick = () => { $('#pause').classList.remove('on'); hardStop(); playStage ? startStage(playStage) : startGame(current); };
$('#rBack').onclick = () => { if (playStage && !playStage.free) { renderStory(); show('story'); } else { renderGrid(); show('select'); } };
$('#rRetry').onclick = () => playStage ? startStage(playStage) : startGame(current);
$('#setBtn').onclick = () => { $('#offR').value = OFFSET; $('#offV').textContent = OFFSET; $('#settings').classList.add('on'); };
$('#offR').oninput = e => { OFFSET = +e.target.value; $('#offV').textContent = (OFFSET > 0 ? '+' : '') + OFFSET; store.set('hb_off', OFFSET); };
$('#sClose').onclick = () => $('#settings').classList.remove('on');
$('#parade').innerHTML = CHARS.map((c, i) => `<img src="${SPRITES[c.id]}" alt="" style="animation-delay:${i * .1}s">`).join('');
resize();
</script>
</body>
</html>
